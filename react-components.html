<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>React Scaffold</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-10">

  <div id="root"></div>

  <script type="text/babel">

    /* ============================================================
       UTILS
    ============================================================ */
    function Section({ title, children }) {
      return (
        <div className="mb-10">
          <h2 className="text-xl font-bold text-gray-500 uppercase tracking-widest mb-4 border-b pb-2">
            {title}
          </h2>
          <div className="flex flex-wrap gap-4">
            {children}
          </div>
        </div>
      );
    }

    function Card({ title, children }) {
      return (
        <div className="bg-white rounded-xl shadow p-6 w-full max-w-sm">
          <h3 className="font-bold text-lg mb-4">{title}</h3>
          {children}
        </div>
      );
    }


    /* ============================================================
       01 — COMPONENTS & JSX
       Topics: function component, returning JSX, expressions in JSX
    ============================================================ */
    function ComponentsDemo() {
      const name = "Christian";
      const now = new Date().toLocaleTimeString();

      return (
        <Card title="Components & JSX">
          <p className="text-gray-600">Hello, <strong>{name}</strong>!</p>
          <p className="text-gray-400 text-sm mt-1">Time: {now}</p>
        </Card>
      );
    }


    /* ============================================================
       02 — PROPS
       Topics: passing props, default props, prop types
    ============================================================ */
    function Greeting({ name, role = "Developer" }) {
      return (
        <Card title="Props">
          <p className="text-gray-600">Name: <strong>{name}</strong></p>
          <p className="text-gray-600">Role: <strong>{role}</strong></p>
        </Card>
      );
    }


    /* ============================================================
       03 — useState
       Topics: number state, string state, boolean state, array state
    ============================================================ */
    function UseStateDemo() {
      const [count, setCount] = React.useState(0);

      return (
        <Card title="useState">
          <p className="text-5xl font-bold text-center mb-4">{count}</p>
          <div className="flex gap-2 justify-center">
            <button onClick={() => setCount(count - 1)} className="bg-gray-200 px-4 py-2 rounded-lg font-bold hover:bg-gray-300">-</button>
            <button onClick={() => setCount(0)} className="bg-red-500 text-white px-4 py-2 rounded-lg font-bold hover:bg-red-600">Reset</button>
            <button onClick={() => setCount(count + 1)} className="bg-blue-500 text-white px-4 py-2 rounded-lg font-bold hover:bg-blue-600">+</button>
          </div>
        </Card>
      );
    }


    /* ============================================================
       04 — useEffect
       Topics: on mount, on dependency change, cleanup
    ============================================================ */
    function UseEffectDemo() {
      const [count, setCount] = React.useState(0);
      const [log, setLog] = React.useState("Waiting...");

      React.useEffect(() => {
        setLog(`Count changed to ${count}`);
      }, [count]);

      return (
        <Card title="useEffect">
          <p className="text-sm text-gray-500 mb-3 font-mono">{log}</p>
          <button onClick={() => setCount(count + 1)} className="bg-blue-500 text-white px-4 py-2 rounded-lg font-bold hover:bg-blue-600 w-full">
            Increment ({count})
          </button>
        </Card>
      );
    }


    /* ============================================================
       05 — CONDITIONAL RENDERING
       Topics: ternary, && operator, early return
    ============================================================ */
    function ConditionalDemo() {
      const [isLoggedIn, setIsLoggedIn] = React.useState(false);

      return (
        <Card title="Conditional Rendering">
          {isLoggedIn ? (
            <p className="text-green-600 font-bold mb-3">✅ Welcome back!</p>
          ) : (
            <p className="text-red-500 font-bold mb-3">❌ Please log in.</p>
          )}
          <button
            onClick={() => setIsLoggedIn(!isLoggedIn)}
            className="bg-gray-800 text-white px-4 py-2 rounded-lg font-bold hover:bg-gray-700 w-full"
          >
            {isLoggedIn ? "Logout" : "Login"}
          </button>
        </Card>
      );
    }


    /* ============================================================
       06 — LISTS & KEYS
       Topics: .map(), unique keys, rendering arrays
    ============================================================ */
    function ListsDemo() {
      const fruits = ["🍎 Apple", "🍌 Banana", "🍇 Grapes", "🍊 Orange"];

      return (
        <Card title="Lists & Keys">
          <ul className="space-y-2">
            {fruits.map((fruit, index) => (
              <li key={index} className="bg-gray-100 rounded-lg px-3 py-2 text-sm">{fruit}</li>
            ))}
          </ul>
        </Card>
      );
    }


    /* ============================================================
       07 — FORMS & CONTROLLED INPUTS
       Topics: controlled input, onChange, onSubmit
    ============================================================ */
    function FormsDemo() {
      const [value, setValue] = React.useState("");
      const [submitted, setSubmitted] = React.useState("");

      const handleSubmit = () => {
        if (!value.trim()) return;
        setSubmitted(value);
        setValue("");
      };

      return (
        <Card title="Forms & Controlled Inputs">
          <input
            type="text"
            value={value}
            onChange={(e) => setValue(e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && handleSubmit()}
            placeholder="Type something..."
            className="border rounded-lg px-3 py-2 w-full mb-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300"
          />
          <button onClick={handleSubmit} className="bg-blue-500 text-white px-4 py-2 rounded-lg font-bold hover:bg-blue-600 w-full mb-3">
            Submit
          </button>
          {submitted && <p className="text-gray-600 text-sm">Submitted: <strong>{submitted}</strong></p>}
        </Card>
      );
    }


    /* ============================================================
       08 — LIFTING STATE UP
       Topics: shared state in parent, passing handlers as props
    ============================================================ */
    function ChildA({ onSend }) {
      return (
        <button onClick={() => onSend("Hello from Child A!")} className="bg-purple-500 text-white px-3 py-2 rounded-lg text-sm font-bold hover:bg-purple-600">
          Send from A
        </button>
      );
    }

    function ChildB({ message }) {
      return (
        <p className="text-gray-600 text-sm mt-3">{message || "Waiting for message..."}</p>
      );
    }

    function LiftingStateDemo() {
      const [message, setMessage] = React.useState("");

      return (
        <Card title="Lifting State Up">
          <p className="text-gray-400 text-xs mb-3">Parent holds the state. Child A sends, Child B receives.</p>
          <ChildA onSend={setMessage} />
          <ChildB message={message} />
        </Card>
      );
    }


    /* ============================================================
       09 — useContext
       Topics: createContext, Provider, useContext consumer
    ============================================================ */
    const ThemeContext = React.createContext("light");

    function ThemedBox() {
      const theme = React.useContext(ThemeContext);
      return (
        <div className={`rounded-lg p-3 text-sm font-bold text-center ${theme === "dark" ? "bg-gray-800 text-white" : "bg-gray-100 text-gray-800"}`}>
          Current theme: {theme}
        </div>
      );
    }

    function UseContextDemo() {
      const [theme, setTheme] = React.useState("light");

      return (
        <Card title="useContext">
          <ThemeContext.Provider value={theme}>
            <ThemedBox />
            <button
              onClick={() => setTheme(theme === "light" ? "dark" : "light")}
              className="bg-gray-800 text-white px-4 py-2 rounded-lg font-bold hover:bg-gray-700 w-full mt-3"
            >
              Toggle Theme
            </button>
          </ThemeContext.Provider>
        </Card>
      );
    }


    /* ============================================================
       10 — useRef
       Topics: DOM reference, focus, storing mutable value
    ============================================================ */
    function UseRefDemo() {
      const inputRef = React.useRef(null);

      return (
        <Card title="useRef">
          <input
            ref={inputRef}
            type="text"
            placeholder="Click button to focus me"
            className="border rounded-lg px-3 py-2 w-full mb-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300"
          />
          <button
            onClick={() => inputRef.current.focus()}
            className="bg-blue-500 text-white px-4 py-2 rounded-lg font-bold hover:bg-blue-600 w-full"
          >
            Focus Input
          </button>
        </Card>
      );
    }


    /* ============================================================
       11 — useReducer
       Topics: reducer function, dispatch, action types
    ============================================================ */
    function reducer(state, action) {
      switch (action.type) {
        case "increment": return { count: state.count + 1 };
        case "decrement": return { count: state.count - 1 };
        case "reset":     return { count: 0 };
        default:          return state;
      }
    }

    function UseReducerDemo() {
      const [state, dispatch] = React.useReducer(reducer, { count: 0 });

      return (
        <Card title="useReducer">
          <p className="text-5xl font-bold text-center mb-4">{state.count}</p>
          <div className="flex gap-2 justify-center">
            <button onClick={() => dispatch({ type: "decrement" })} className="bg-gray-200 px-4 py-2 rounded-lg font-bold hover:bg-gray-300">-</button>
            <button onClick={() => dispatch({ type: "reset" })} className="bg-red-500 text-white px-4 py-2 rounded-lg font-bold hover:bg-red-600">Reset</button>
            <button onClick={() => dispatch({ type: "increment" })} className="bg-blue-500 text-white px-4 py-2 rounded-lg font-bold hover:bg-blue-600">+</button>
          </div>
        </Card>
      );
    }


    /* ============================================================
       12 — CUSTOM HOOKS
       Topics: extracting logic into reusable hooks
    ============================================================ */
    function useToggle(initial = false) {
      const [value, setValue] = React.useState(initial);
      const toggle = () => setValue(prev => !prev);
      return [value, toggle];
    }

    function CustomHookDemo() {
      const [isVisible, toggleVisible] = useToggle(false);

      return (
        <Card title="Custom Hook — useToggle">
          <button onClick={toggleVisible} className="bg-indigo-500 text-white px-4 py-2 rounded-lg font-bold hover:bg-indigo-600 w-full mb-3">
            Toggle Box
          </button>
          {isVisible && (
            <div className="bg-indigo-100 text-indigo-800 rounded-lg p-3 text-sm font-bold text-center">
              👋 I'm visible now!
            </div>
          )}
        </Card>
      );
    }


    /* ============================================================
       13 — useMemo
       Topics: memoizing expensive computations
    ============================================================ */
    function UseMemoDemo() {
      const [count, setCount] = React.useState(0);
      const [tick, setTick] = React.useState(0);

      const expensiveValue = React.useMemo(() => {
        let total = 0;
        for (let i = 0; i < 5_000_000; i++) total += i;
        return total + count;
      }, [count]);

      return (
        <Card title="useMemo">
          <p className="text-sm text-gray-500 mb-1">Expensive: <strong>{expensiveValue}</strong></p>
          <p className="text-sm text-gray-500 mb-3">Tick (no recompute): <strong>{tick}</strong></p>
          <div className="flex gap-2">
            <button onClick={() => setCount(count + 1)} className="bg-blue-500 text-white px-3 py-2 rounded-lg font-bold hover:bg-blue-600 flex-1 text-sm">
              Recompute ({count})
            </button>
            <button onClick={() => setTick(tick + 1)} className="bg-gray-200 px-3 py-2 rounded-lg font-bold hover:bg-gray-300 flex-1 text-sm">
              Tick ({tick})
            </button>
          </div>
        </Card>
      );
    }


    /* ============================================================
       14 — useCallback + React.memo
       Topics: stable function refs, preventing child re-renders
    ============================================================ */
    const ExpensiveButton = React.memo(function ExpensiveButton({ onClick, label }) {
      const renders = React.useRef(0);
      renders.current++;
      return (
        <button onClick={onClick} className="bg-pink-500 text-white px-3 py-2 rounded-lg font-bold hover:bg-pink-600 w-full text-sm">
          {label} (rendered {renders.current}x)
        </button>
      );
    });

    function UseCallbackDemo() {
      const [count, setCount] = React.useState(0);
      const [other, setOther] = React.useState(0);

      const handleClick = React.useCallback(() => {
        setCount(c => c + 1);
      }, []);

      return (
        <Card title="useCallback + React.memo">
          <p className="text-sm text-gray-500 mb-3">Count: <strong>{count}</strong> · Other: <strong>{other}</strong></p>
          <ExpensiveButton onClick={handleClick} label="Increment Count" />
          <button onClick={() => setOther(other + 1)} className="bg-gray-200 px-3 py-2 rounded-lg font-bold hover:bg-gray-300 w-full mt-2 text-sm">
            Change "Other" — child should NOT re-render
          </button>
        </Card>
      );
    }


    /* ============================================================
       15 — Children & Composition
       Topics: props.children, slot patterns
    ============================================================ */
    function Panel({ header, children, footer }) {
      return (
        <div className="border rounded-lg overflow-hidden">
          <div className="bg-gray-100 px-3 py-2 text-xs font-bold uppercase text-gray-600">{header}</div>
          <div className="p-3 text-sm text-gray-700">{children}</div>
          <div className="bg-gray-50 px-3 py-2 text-xs text-gray-500">{footer}</div>
        </div>
      );
    }

    function ChildrenDemo() {
      return (
        <Card title="Children & Composition">
          <Panel header="Inbox" footer="Updated just now">
            <p>You have <strong>3 new messages</strong>.</p>
            <p className="text-gray-400">Anything between the tags becomes children.</p>
          </Panel>
        </Card>
      );
    }


    /* ============================================================
       16 — Fragments
       Topics: <>...</> grouping without extra DOM
    ============================================================ */
    function FragmentRow() {
      return (
        <>
          <td className="px-2 py-1 border">Cell A</td>
          <td className="px-2 py-1 border">Cell B</td>
          <td className="px-2 py-1 border">Cell C</td>
        </>
      );
    }

    function FragmentsDemo() {
      return (
        <Card title="Fragments">
          <p className="text-xs text-gray-400 mb-2">Sibling cells without a wrapper div — needed inside &lt;tr&gt;.</p>
          <table className="w-full text-sm">
            <tbody>
              <tr><FragmentRow /></tr>
              <tr><FragmentRow /></tr>
            </tbody>
          </table>
        </Card>
      );
    }


    /* ============================================================
       17 — Portals
       Topics: ReactDOM.createPortal — render outside parent
    ============================================================ */
    function Modal({ open, onClose, children }) {
      if (!open) return null;
      return ReactDOM.createPortal(
        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50" onClick={onClose}>
          <div onClick={(e) => e.stopPropagation()} className="bg-white rounded-xl p-6 max-w-sm w-full mx-4 shadow-2xl">
            {children}
            <button onClick={onClose} className="bg-gray-800 text-white px-4 py-2 rounded-lg font-bold hover:bg-gray-700 w-full mt-4">
              Close
            </button>
          </div>
        </div>,
        document.body
      );
    }

    function PortalDemo() {
      const [open, setOpen] = React.useState(false);
      return (
        <Card title="Portals">
          <p className="text-xs text-gray-400 mb-3">Modal renders into document.body, not this card.</p>
          <button onClick={() => setOpen(true)} className="bg-orange-500 text-white px-4 py-2 rounded-lg font-bold hover:bg-orange-600 w-full">
            Open Modal
          </button>
          <Modal open={open} onClose={() => setOpen(false)}>
            <h3 className="font-bold text-lg mb-2">Hello from a Portal!</h3>
            <p className="text-sm text-gray-600">I'm rendered outside the card's DOM tree.</p>
          </Modal>
        </Card>
      );
    }


    /* ============================================================
       18 — Async Data Fetching
       Topics: useEffect + fetch, loading/error/empty states
    ============================================================ */
    function FetchDemo() {
      const [data, setData] = React.useState(null);
      const [loading, setLoading] = React.useState(false);
      const [error, setError] = React.useState(null);
      const [id, setId] = React.useState(1);

      React.useEffect(() => {
        let cancelled = false;
        setLoading(true);
        setError(null);
        fetch(`https://jsonplaceholder.typicode.com/todos/${id}`)
          .then(r => {
            if (!r.ok) throw new Error(`HTTP ${r.status}`);
            return r.json();
          })
          .then(json => { if (!cancelled) setData(json); })
          .catch(err => { if (!cancelled) setError(err.message); })
          .finally(() => { if (!cancelled) setLoading(false); });
        return () => { cancelled = true; };
      }, [id]);

      return (
        <Card title="Async Fetch">
          <div className="min-h-[80px] mb-3 text-sm">
            {loading && <p className="text-gray-400">Loading...</p>}
            {error && <p className="text-red-500">Error: {error}</p>}
            {!loading && !error && data && (
              <div className="bg-gray-50 rounded-lg p-3">
                <p className="font-bold">#{data.id} — {data.title}</p>
                <p className="text-xs text-gray-500 mt-1">Done: {String(data.completed)}</p>
              </div>
            )}
          </div>
          <button onClick={() => setId(id + 1)} className="bg-teal-500 text-white px-4 py-2 rounded-lg font-bold hover:bg-teal-600 w-full">
            Next Todo (#{id + 1})
          </button>
        </Card>
      );
    }


    /* ============================================================
       19 — useId
       Topics: stable accessible IDs for label/input pairing
    ============================================================ */
    function UseIdDemo() {
      const nameId = React.useId();
      const emailId = React.useId();
      return (
        <Card title="useId">
          <p className="text-xs text-gray-400 mb-3">Auto-generated IDs link labels to inputs accessibly.</p>
          <label htmlFor={nameId} className="text-sm font-bold">Name</label>
          <input id={nameId} className="border rounded-lg px-3 py-2 w-full mb-3 text-sm" />
          <label htmlFor={emailId} className="text-sm font-bold">Email</label>
          <input id={emailId} type="email" className="border rounded-lg px-3 py-2 w-full text-sm" />
          <p className="text-xs text-gray-400 mt-2 font-mono">name: {nameId}</p>
        </Card>
      );
    }


    /* ============================================================
       20 — useTransition
       Topics: marking non-urgent updates as transitions
    ============================================================ */
    function UseTransitionDemo() {
      const [input, setInput] = React.useState("");
      const [list, setList] = React.useState([]);
      const [isPending, startTransition] = React.useTransition();

      const handleChange = (e) => {
        const value = e.target.value;
        setInput(value);
        startTransition(() => {
          const items = Array.from({ length: 5000 }, (_, i) => `${value} — item ${i}`);
          setList(items);
        });
      };

      return (
        <Card title="useTransition">
          <input
            value={input}
            onChange={handleChange}
            placeholder="Type fast..."
            className="border rounded-lg px-3 py-2 w-full mb-3 text-sm"
          />
          <p className="text-xs text-gray-400 mb-2">{isPending ? "Updating list..." : `${list.length} items`}</p>
          <div className="h-24 overflow-auto bg-gray-50 rounded-lg p-2 text-xs">
            {list.slice(0, 50).map((item, i) => <div key={i}>{item}</div>)}
          </div>
        </Card>
      );
    }


    /* ============================================================
       21 — Error Boundary
       Topics: class component, componentDidCatch, fallback UI
    ============================================================ */
    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, message: "" };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, message: error.message };
      }
      reset = () => this.setState({ hasError: false, message: "" });
      render() {
        if (this.state.hasError) {
          return (
            <div className="bg-red-50 border border-red-200 rounded-lg p-3 text-sm">
              <p className="text-red-600 font-bold">💥 {this.state.message}</p>
              <button onClick={this.reset} className="bg-red-500 text-white px-3 py-1 rounded-lg font-bold hover:bg-red-600 mt-2 text-xs">
                Reset
              </button>
            </div>
          );
        }
        return this.props.children;
      }
    }

    function Boom({ explode }) {
      if (explode) throw new Error("Kaboom! Caught by boundary.");
      return <p className="text-green-600 text-sm">✅ All good, no errors.</p>;
    }

    function ErrorBoundaryDemo() {
      const [explode, setExplode] = React.useState(false);
      return (
        <Card title="Error Boundary">
          <ErrorBoundary>
            <Boom explode={explode} />
          </ErrorBoundary>
          <button onClick={() => setExplode(true)} className="bg-red-500 text-white px-4 py-2 rounded-lg font-bold hover:bg-red-600 w-full mt-3">
            Trigger Error
          </button>
        </Card>
      );
    }


    /* ============================================================
       APP
    ============================================================ */
    function App() {
      return (
        <div className="max-w-6xl mx-auto">
          <div className="mb-10">
            <h1 className="text-4xl font-bold">React Scaffold</h1>
            <p className="text-gray-400 mt-1 font-mono text-sm">// your personal refresher — edit freely</p>
          </div>

          <Section title="01 — Components & JSX">
            <ComponentsDemo />
          </Section>

          <Section title="02 — Props">
            <Greeting name="Christian" role="Full-stack Dev" />
            <Greeting name="Kate" />
          </Section>

          <Section title="03 — useState">
            <UseStateDemo />
          </Section>

          <Section title="04 — useEffect">
            <UseEffectDemo />
          </Section>

          <Section title="05 — Conditional Rendering">
            <ConditionalDemo />
          </Section>

          <Section title="06 — Lists & Keys">
            <ListsDemo />
          </Section>

          <Section title="07 — Forms & Controlled Inputs">
            <FormsDemo />
          </Section>

          <Section title="08 — Lifting State Up">
            <LiftingStateDemo />
          </Section>

          <Section title="09 — useContext">
            <UseContextDemo />
          </Section>

          <Section title="10 — useRef">
            <UseRefDemo />
          </Section>

          <Section title="11 — useReducer">
            <UseReducerDemo />
          </Section>

          <Section title="12 — Custom Hooks">
            <CustomHookDemo />
          </Section>

          <Section title="13 — useMemo">
            <UseMemoDemo />
          </Section>

          <Section title="14 — useCallback + React.memo">
            <UseCallbackDemo />
          </Section>

          <Section title="15 — Children & Composition">
            <ChildrenDemo />
          </Section>

          <Section title="16 — Fragments">
            <FragmentsDemo />
          </Section>

          <Section title="17 — Portals">
            <PortalDemo />
          </Section>

          <Section title="18 — Async Fetch">
            <FetchDemo />
          </Section>

          <Section title="19 — useId">
            <UseIdDemo />
          </Section>

          <Section title="20 — useTransition">
            <UseTransitionDemo />
          </Section>

          <Section title="21 — Error Boundary">
            <ErrorBoundaryDemo />
          </Section>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);

  </script>
</body>
</html>
