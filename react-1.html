<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>React useState</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-10">

  <div id="root"></div>

  <script type="text/babel">

    function Counter() {
      const [count, setCount] = React.useState(0);

      return (
        <div className="bg-white rounded-xl p-6 shadow max-w-sm">
          <h2 className="text-xl font-bold mb-4">Counter</h2>
          <p className="text-5xl font-bold text-center mb-6">{count}</p>
          <div className="flex gap-2 justify-center">
            <button
              onClick={() => setCount(count - 1)}
              className="bg-gray-200 px-4 py-2 rounded-lg font-bold hover:bg-gray-300"
            >
              -
            </button>
            <button
              onClick={() => setCount(0)}
              className="bg-red-500 text-white px-4 py-2 rounded-lg font-bold hover:bg-red-600"
            >
              Reset
            </button>
            <button
              onClick={() => setCount(count + 1)}
              className="bg-blue-500 text-white px-4 py-2 rounded-lg font-bold hover:bg-blue-600"
            >
              +
            </button>
          </div>
        </div>
      );
    }

    function App() {
      return (
        <div>
          <h1 className="text-3xl font-bold mb-6">useState Demos</h1>
          <Counter />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);

  </script>
</body>
</html>
